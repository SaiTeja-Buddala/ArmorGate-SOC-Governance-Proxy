# =============================================================================
# ArmorGate - Policy Definitions (Template)
# File: config/policies.yaml
#
# This YAML file defines the deterministic security policies that the
# ArmorGate Policy Engine evaluates for every Action Request submitted
# by autonomous SOC agents.
#
# Decision classes:
#   - auto_approve : low-risk, executed immediately
#   - hitl_queue   : medium-risk, requires Slack human approval
#   - deny_block   : high-risk, blocked and audited
#
# Structure of a policy entry:
#   - id            : unique policy identifier (string)
#     name          : human-readable name
#     description   : what this policy guards against
#     match:
#       action_type : the SOC agent action this policy applies to
#       resource    : optional resource pattern (regex / glob)
#       risk_level  : low | medium | high
#     decision      : auto_approve | hitl_queue | deny_block
#     owasp_llm     : optional reference (e.g. LLM08_excessive_agency)
#     armor_control : optional ARMOR control reference
# =============================================================================

version: 0.1.0

policies: []

